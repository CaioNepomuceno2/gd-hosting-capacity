[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdhc"
version = "0.1.0"
description = "Capacidade de hospedagem de geração distribuída na rede de distribuição, com dados abertos da ANEEL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyogrio>=0.9",
  "geopandas>=1.0",
  "requests>=2.32",
  "pyyaml>=6",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
